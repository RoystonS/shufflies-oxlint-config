name: Pull Request CI
on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to check after automated formatting
        required: true
        type: string

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - name: Checkout pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
      - name: Checkout dispatched ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      - name: Install latest npm
        run: npm i -g npm@12
      - name: Detailed node+npm versions
        run: |
          node -v
          npm -v
      - name: Install dependencies
        run: npm clean-install
      - name: Build package
        run: npm run build
      - name: Check formatting
        run: npm run format:check
      - name: Run tests
        run: npm run test

  # Collect the above matrix together into a single check that PRs can be blocked on
  ci-success:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: always()
    steps:
      - name: Check build and test results
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "Build and test failed"
            exit 1
          fi
          echo "All checks passed"
